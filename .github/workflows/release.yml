name: Release

# Publishes the extension to the VS Code Marketplace and Open VSX whenever a
# push to main lands a version in package.json that has not been released yet.
# A release is marked by the git tag v<version>, so re-runs and pushes that
# don't bump the version are no-ops.

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Check whether package.json version is unreleased
        id: check
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released, skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version v$version detected."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      VSIX: lovecanvas-${{ needs.check-version.outputs.version }}.vsix
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Package extension
        run: pnpm run package --out "$VSIX"

      - name: Publish to VS Code Marketplace
        run: pnpm exec vsce publish --packagePath "$VSIX" --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: pnpm dlx ovsx@1.3.0 publish "$VSIX" --pat "$OVSX_PAT" --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Create GitHub release
        run: |
          gh release create "v$VERSION" "$VSIX" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
